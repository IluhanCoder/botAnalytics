services:
  # Backend API
  - type: web
    name: botanalytics-api
    env: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_URI
        sync: false
      - key: CLIENT_URL
        value: https://botanalytics-client.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: LOW_MEMORY_MODE
        value: true

  # Frontend (Static Site)
  - type: web
    name: botanalytics-client
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://botanalytics-api.onrender.com
