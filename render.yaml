services:
  # Backend API
  - type: web
    name: botanalytics-api
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm run dev
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
    disk:
      name: models-cache
      mountPath: /opt/render/project/src/server/models
      sizeGB: 2

  # Frontend (Static Site)
  - type: web
    name: botanalytics-client
    env: static
    region: frankfurt
    plan: free
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://botanalytics-api.onrender.com
